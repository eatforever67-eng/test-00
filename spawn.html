<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive - Personal Storage</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .btn {
            background-color: #1a73e8;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            margin-top: 15px;
        }
        .btn:hover {
            background-color: #1557b0;
        }
    </style>
</head>
<body>

    <h2>My Drive</h2>
    <p>File type unsupported in current preview mode.</p>
    <!-- target="_blank" ensures it opens outside an iframe context -->
    <a href="https://now.gg" target="_blank" class="btn">Open with Web Viewer</a>

</body>
</html>
